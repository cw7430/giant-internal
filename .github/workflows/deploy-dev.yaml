name: Deploy Dev Only CI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Test & Build
    runs-on: ubuntu-latest
    environment: development

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: giant
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d giant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Generate JOOQ
        run: ./gradlew generateJooq -Pprofile=test

      - name: Integration Test And Build
        run: ./gradlew build

      - name: Prepare Artifact
        if: success()
        run: |
          mkdir -p artifact
          cp build/libs/giant-1.0.0.jar artifact/app.jar

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: giant-dev
          path: artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quick-test-report
          path: build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7